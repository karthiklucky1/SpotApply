<!DOCTYPE html>
<html><head><title>Account Manager — Ashby-style application (upload box emptied by the site)</title></head>
<body>
  <h1>Account Manager</h1>
  <!-- A real Ashby form's resume field (live test 2026-11-14, synthetic copy):
       the site READS the chosen file and then empties the input, showing the
       file's name beside a "Replace" button. The input holds nothing, the
       resume is attached — and the submit check read it as missing. -->
  <form id="application-form" action="/thanks.html" method="get">
    <div class="ashby-application-form-field-entry">
      <label for="_systemfield_name">Name*</label>
      <input type="text" id="_systemfield_name" name="_systemfield_name" required>
    </div>
    <div class="ashby-application-form-field-entry">
      <label for="_systemfield_email">Email*</label>
      <input type="email" id="_systemfield_email" name="_systemfield_email" required>
    </div>
    <div class="ashby-application-form-field-entry" id="resume-entry">
      <label for="_systemfield_resume">Resume*</label>
      <div class="dropzone">
        <input type="file" id="_systemfield_resume" style="position:absolute;opacity:0;width:1px;height:1px">
        <div id="resume-shown"></div>
        <button type="button" id="resume-pick">Upload file</button>
        <span>or drag and drop here</span>
      </div>
    </div>
    <div class="ashby-application-form-field-entry">
      <label for="twitter">Twitter</label>
      <input type="text" id="twitter" name="twitter">
    </div>
    <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
  </form>
  <script>
    const input = document.getElementById('_systemfield_resume');
    const shown = document.getElementById('resume-shown');
    input.addEventListener('change', function () {
      if (!input.files.length) return;
      const name = input.files[0].name;
      setTimeout(function () {
        input.value = '';                               // the site has the file; the box is emptied
        shown.innerHTML = '<span class="file-name">' + name + '</span> ' +
                          '<button type="button" id="resume-clear" title="Clear">×</button>';
        document.getElementById('resume-pick').textContent = 'Replace';
        document.getElementById('resume-clear').addEventListener('click', function () {
          shown.innerHTML = '';
          document.getElementById('resume-pick').textContent = 'Upload file';
        });
      }, 400);
    });
  </script>
</body>
</html>
