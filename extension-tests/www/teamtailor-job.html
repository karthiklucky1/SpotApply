<!DOCTYPE html>
<html><head><title>Backend Engineer — HarnessCo careers (Teamtailor-style job page)</title></head>
<body>
  <!-- A Teamtailor job page (live test 2026-11-14, synthetic copy). The page
       has ONE email box and it is not the applicant's: it is the employer's
       own staff sign-in. The application opens from "Apply for this job".
       The applicant's email was typed into the staff box and the form was
       never opened. -->
  <header>
    <form id="staff-connect" action="/staff-login-must-not-be-used.html" method="get">
      <label for="staff-email">Employee? Connect with your work email</label>
      <input type="email" id="staff-email" name="email" placeholder="you@harnessco.example">
      <button type="submit" id="staff-login">Log in</button>
    </form>
  </header>
  <main>
    <h1>Backend Engineer</h1>
    <p>Engineering · Remote · Full-time</p>
    <p>We build tools for logistics teams. You will design services in Python and Go.</p>
    <a id="apply-btn" href="/apply.html?from=teamtailor">Apply for this job</a>
  </main>
</body>
</html>
