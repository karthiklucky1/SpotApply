<!DOCTYPE html>
<html><head><title>Staff Engineer — application behind a visible CAPTCHA</title></head>
<body>
  <h1>Prove you are human</h1>
  <!-- A VISIBLE challenge with no application form behind it: the extension
       must pause, tell the dashboard (captcha_needed) and never press anything.
       The real form only appears after the challenge is solved. -->
  <div class="cf-turnstile" style="width:300px;height:65px;border:1px solid #999;background:#f3f3f3;">
    Cloudflare Turnstile placeholder
  </div>
  <p>Prove you are human to continue to the application.</p>
</body>
</html>
