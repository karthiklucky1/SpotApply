<!DOCTYPE html>
<html>
<head><title>Software Engineer — Application (Greenhouse-style test form)</title></head>
<body>
  <h1>Apply for Software Engineer</h1>
  <form id="application_form">
    <div><label for="first_name">First Name *</label>
      <input type="text" id="first_name" name="job_application[first_name]"></div>
    <div><label for="last_name">Last Name *</label>
      <input type="text" id="last_name" name="job_application[last_name]"></div>
    <div><label for="email">Email *</label>
      <input type="email" id="email" name="job_application[email]"></div>
    <div><label for="phone">Phone</label>
      <input type="tel" id="phone" name="job_application[phone]"></div>
    <div><label for="candidate-location">Location (City)</label>
      <input type="text" id="candidate-location" name="job_application[location]"></div>
    <div><label for="linkedin">LinkedIn Profile</label>
      <input type="text" id="linkedin" name="job_application[answers_attributes][0][text_value]"></div>
    <div><label for="website">Website / Portfolio</label>
      <input type="text" id="website" name="job_application[answers_attributes][1][text_value]"></div>
    <div><label for="resume">Resume/CV *</label>
      <input type="file" id="resume" name="job_application[resume]"></div>
    <div><label for="cover_letter_text">Cover Letter</label>
      <textarea id="cover_letter_text" name="job_application[cover_letter_text]"></textarea></div>
    <input type="submit" value="Submit Application">
  </form>
</body>
</html>
