# Deploy as a SEPARATE Railway service in the same project, with its root
# directory set to `browser-service/`. It shares nothing with the app container
# except the private network and BROWSER_SERVICE_TOKEN.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
